<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <title>Kokkola - Rekisteröityminen</title>
</head>

<body>

    <main class="card">

        <h1>Kokkola</h1>

        <nav>
            <a href="index.html">Etusivu</a>
            <a href="gallery.html">Nähtävyydet</a>
            <a href="register.html"><strong>Rekisteröityminen</strong></a>
        </nav>

        <h2>Rekisteröityminen</h2>

        <p>
            Luo käyttäjätili ja liity Kokkolan verkkoyhteisöön!
            Täytä alla olevat tiedot ja hyväksy käyttöehdot.
        </p>

        <form class="register-form" action="https://httpbin.org/post" method="post">

            <div class="form-row">
                <label for="name">Nimi:</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>

            <div class="form-row">
                <label for="email">Sähköpostiosoite:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="form-row">
                <label for="username">Luo käyttäjänimi:</label>
                <input type="text" id="username" name="username" minlength="3" autocomplete="username" required>
            </div>

            <div class="form-row">
                <label for="password">Luo salasana:</label>
                <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
            </div>

            <div class="form-row">
                <label for="user-type">Käyttäjätyyppi:</label>
                <select id="user-type" name="user_type" required>
                    <option value="" selected disabled>Valitse käyttäjätyyppi</option>
                    <option value="tourist">Matkailija</option>
                    <option value="local">Paikallinen</option>
                    <option value="kokkola_visitor">Kokkolaan tutustuja</option>
                </select>
            </div>

            <div class="form-row checkbox-row">
                <input type="checkbox" id="terms" name="terms" value="accepted" required>
                <label for="terms">Hyväksyn sivuston käyttöehdot.</label>
            </div>

            <p class="terms-info">
                Hyväksymällä käyttöehdot voit jatkaa rekisteröitymistä.
            </p>

            <button type="submit">Register</button>

        </form>

    </main>

</body>

</html>
